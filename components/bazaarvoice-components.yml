note: >-
  Bazaarvoice's primary integration path for most clients is not the REST API at all - it is a
  hosted client-side rendering layer ("Hosted UI" / "JS-API") loaded from the Bazaarvoice CDN. The
  loader script is the entry point for every display, submission and analytics component below.
loaders:
- name: bv.js (BV Loader, v2 display integration)
  registry: cdn
  url_template: https://apps.bazaarvoice.com/deployments/{client_name}/{siteID}/{environment}/{locale}/bv.js
  version: null
  version_note: >-
    Distribution is unpinned and per-client. The script path carries the client name, site id,
    environment and locale but no version segment, and there is no CDN metadata endpoint for it,
    so a consumer cannot tell which build they are being served either. Recorded as null after
    checking, not skipped.
  environments: [staging, production]
  purpose: Loads the Bazaarvoice JavaScript library, renders hosted UI containers, and collects BV Pixel events.
- name: bvapi.js (v1 display integration)
  registry: cdn
  version: null
  status: superseded
  version_note: >-
    Legacy loader superseded by bv.js; Bazaarvoice recommends bv.js for performance and continued
    support. Same unpinned per-client distribution shape, no version in the URL.
