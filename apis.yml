aid: bazaarvoice
name: Bazaarvoice
description: >-
  Bazaarvoice operates a retail and brand user-generated-content network that collects,
  moderates, and syndicates ratings, reviews, questions and answers, and product-sampling
  content across thousands of brand and retailer sites. Its developer platform exposes a
  family of APIs - the flagship Conversations API for retrieving and submitting UGC, the
  V2.0 Content Search API for searching reviews/questions/answers/contributors and product
  catalog lookahead, plus the Transactions, Response, Social Commerce, and Authentic
  Discovery APIs, and structured-data (JSON-LD/Microdata) endpoints for SEO. APIs
  authenticate with a Bazaarvoice Portal-managed passkey (Bv-Passkey header) or, for the
  Transactions and Response APIs, 2-legged OAuth2 client credentials. Official iOS, Android,
  SEO, Magento, and Salesforce Commerce SDKs are published on GitHub.
