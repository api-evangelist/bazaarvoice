aid: bazaarvoice
name: Bazaarvoice
description: 'Bazaarvoice operates a retail and brand user-generated-content network that collects, moderates,
  syndicates and now makes machine-discoverable the ratings, reviews, questions and answers, and visual
  content published across thousands of brand and retailer sites. Its developer portal publishes twelve
  product sections and eleven distinct OpenAPI documents: the Conversations Display and Conversations
  Submission APIs for retrieving and posting UGC, the V2.0 Content Search API, the Response API for brand
  replies, the Transactions API for scheduling review requests, the Product Sentiment API for NLP-derived
  feature insight, the Notifications Subscriptions and Privacy APIs, the Social Commerce Display API for
  visual UGC, bulk Displayable Content and Product Sentiment exports, and the Authentic Discovery API,
  which returns Schema.org JSON-LD so AI crawlers that do not run JavaScript can read a product''s reviews.
  Authentication varies by product - a Portal-managed passkey (Bv-Passkey header or Passkey query parameter),
  HTTP bearer tokens from 2-legged or 3-legged OAuth2, or an X-Curalate-Api-Key header on the acquired
  Curalate social-commerce platform. Bazaarvoice serves a real llms.txt on every documentation section,
  publishes first-party Postman collections and iOS, Android, SEO, Magento and Salesforce Commerce SDKs
  on GitHub, and is ISO/IEC 27001 certified with a HackerOne vulnerability disclosure policy.'
