              type: string
            SubmissionId:
              type: string
            AnswerText:
              type: string
            TypicalHoursToPost:
              type: string
            Id:
              type: string
            SendEmailAlertWhenPublished:
              type: boolean
        Errors:
          type: array
          items:
            type: string
        Form:
          type: array
          items:
            type: object
            properties:
              Type:
                type: string
              Id:
                type: string
        FormErrors:
          type: object
        SubmissionId:
          type: string
        Data:
          type: object
          properties:
