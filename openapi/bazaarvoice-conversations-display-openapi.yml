          \ are allowed as URL parameters in which case filters are AND'ed. For instance, \"filter=IsActive:eq:false&filter=IsDisabled:eq:false\"\
          \ will match all Products that are neither Active nor Disabled.\n\nBelow we will be stating few examples\
          \ of the filter parameter\n- Single Filter value: &filter=Id:product01\n- Comma Seperated Multiple Filter\
          \ values: &filter=Id:eq:Product1,d7873e29-5a90-4875-b91e-01aa96564882\n- Multiple Filter AND'ed value:\
          \ &filter=IsActive:eq:false&filter=Id:product01&filter=.....\n"
      - name: Filter_[TYPE]
