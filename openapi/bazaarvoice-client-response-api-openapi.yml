          type: string
    ReviewResponseCountResponse:
      type: object
      properties:
        counts:
          type: array
          items:
            type: object
            properties:
              reviewId:
                type: string
              responseCount:
                type: integer
    ReviewResponseCountRequest:
      type: object
      properties:
        reviewIds:
          type: array
          items:
            type: string
    AuthorRelationship:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/AuthorData'
        links:
          $ref: '#/components/schemas/Links'
    AuthorData:
