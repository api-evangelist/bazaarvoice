    ClientResponse:
      type: object
      properties:
        department:
          type: string
        response:
          type: string
        responseBy:
          type: string
        responseSource:
          type: string
        responderClient:
          type: string
        created:
          type: integer
          format: int64
        updated:
          type: integer
          format: int64
      description: The data associated with a given Client Response record
    UserNotAuthorised_2:
      type: object
      properties:
        code:
          type: integer
          format: int32
          description: The HTTP status code generated by the origin server for this occurrence of the problem.
          default: 403
        message:
          type: string
    ReviewData:
      type: object
      properties:
        type:
          type: string
        id:
          type: string
        clientName:
          type: string
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
