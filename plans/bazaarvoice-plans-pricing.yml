note: >-
  Bazaarvoice publishes a named tier ladder but no numbers. The pricing page lists three product
  tiers each for Ratings & Reviews and Social Commerce, plus three support tiers, and describes what
  is included in each - but no price, currency, billing period, quota or overage is stated anywhere
  on the page. Every tier routes to a "contact sales" form. API access itself is not sold as a
  metered product: rate limits and quotas are set per API key in the Bazaarvoice Portal rather than
  attached to a published plan (see rate-limits/bazaarvoice-rate-limits.yml), and the Notifications
  Subscriptions API documents that the Enterprise package is a prerequisite for access.
