note: >-
  Revised from the previous round. The rfc9457 assertion was WRONG: Bazaarvoice does publish
  application/problem+json responses - they were present in the content-search spec already in the
  repo and are declared across the Transactions, Conversations Submission, Product Sentiment and
  Authentic Discovery documents harvested this round. The estate is mixed, not absent.
standards:
- id: openapi-3.0
  conforms: true
  evidence: >-
    Eleven distinct OpenAPI documents (3.0.0 / 3.0.1 / 3.0.3) are published on
    developers.bazaarvoice.com, covering 64 operations across Conversations Display, Conversations
    Submission, Response, Notifications Subscriptions, Transactions, Product Sentiment, Social
    Commerce Media, Authentic Discovery, Displayable Content Export and Product Sentiment Export.
- id: rfc9457-problem-details
  conforms: partial
  evidence: >-
    application/problem+json is declared on 400/401/403/404/429/default responses in
    bazaarvoice-transactions-openapi.json, bazaarvoice-conversations-submission-openapi.json,
    bazaarvoice-product-sentiment-openapi.json, bazaarvoice-authentic-discovery-openapi.json and
    bazaarvoice-content-search-openapi.json, with a shared Problem schema (type/title/status/
    detail/instance). The older Conversations Display, Response and Notifications Subscriptions
    APIs return plain status codes with a JSON body instead.
- id: oauth2
  conforms: true
  evidence: >-
    The Transactions API and Privacy API document a 2-legged OAuth2 client-credentials flow with a
    POST /auth-v1/oauth2/token endpoint; the Privacy and Response APIs additionally document a
    3-legged flow via identity.portal.bazaarvoice.com. Transactions and Response declare HTTP
    bearer securitySchemes in their OpenAPI.
- id: oauth2-scopes
  conforms: false
  evidence: >-
    No scope vocabulary is published or declared. The oauth2 flows are documented in prose only and
    no OpenAPI declares an oauth2 securityScheme with a scopes map, so there is no scope surface to
    capture - scopes/ is deliberately absent rather than empty.
- id: rest-json
  conforms: true
  evidence: JSON request/response bodies over HTTPS with standard verbs across every published API.
- id: cors
